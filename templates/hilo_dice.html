<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hi-Lo Dice Pro - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#05070c',
                        surface: '#0d121c',
                        neonPink: '#ec4899',
                        neonPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
        
        .arena-bg { background: radial-gradient(ellipse at center, #2e1065 0%, #05070c 100%); }

        .glow-pink { filter: drop-shadow(0 0 20px rgba(236,72,153,0.6)); }
        .glow-win { filter: drop-shadow(0 0 30px rgba(16,185,129,0.8)); }
        .glow-lose { filter: drop-shadow(0 0 30px rgba(239,68,68,0.8)); }

        /* 3D Dice CSS Mechanics */
        .dice-scene {
            width: 80px;
            height: 80px;
            perspective: 600px;
            margin: 0 auto;
        }
        @media (min-width: 768px) { .dice-scene { width: 100px; height: 100px; } }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-40px);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 768px) { .cube { transform: translateZ(-50px); } }

        .cube-face {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid #a855f7;
            border-radius: 12px;
            background: linear-gradient(145deg, #fdf4ff, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) { .cube-face { width: 100px; height: 100px; } }

        /* Dots */
        .dot { display: block; width: 14px; height: 14px; border-radius: 50%; background-color: #be185d; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        @media (min-width: 768px) { .dot { width: 20px; height: 20px; } }

        /* Layouts for 1-6 */
        .face-1 { transform: rotateY(  0deg) translateZ(40px); }
        .face-2 { transform: rotateY(180deg) translateZ(40px); }
        .face-3 { transform: rotateY( 90deg) translateZ(40px); }
        .face-4 { transform: rotateY(-90deg) translateZ(40px); }
        .face-5 { transform: rotateX( 90deg) translateZ(40px); }
        .face-6 { transform: rotateX(-90deg) translateZ(40px); }
        
        @media (min-width: 768px) {
            .face-1 { transform: rotateY(  0deg) translateZ(50px); }
            .face-2 { transform: rotateY(180deg) translateZ(50px); }
            .face-3 { transform: rotateY( 90deg) translateZ(50px); }
            .face-4 { transform: rotateY(-90deg) translateZ(50px); }
            .face-5 { transform: rotateX( 90deg) translateZ(50px); }
            .face-6 { transform: rotateX(-90deg) translateZ(50px); }
        }

        /* Dot Grids */
        .face-1 { display: flex; justify-content: center; align-items: center; }
        .face-2 { display: flex; justify-content: space-between; padding: 15px; }
        .face-2 .dot:nth-child(2) { align-self: flex-end; }
        .face-3 { display: flex; justify-content: space-between; padding: 15px; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        .face-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 15px; align-items: center; justify-items: center; }
        .face-5 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; padding: 15px; align-items: center; justify-items: center; }
        .face-5 .dot:nth-child(3) { grid-column: 1 / span 2; }
        .face-6 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; padding: 15px; align-items: center; justify-items: center; }

        /* Rapid Rolling Animation */
        @keyframes rollFast {
            0%   { transform: translateZ(-40px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            25%  { transform: translateZ(-40px) rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
            50%  { transform: translateZ(-40px) rotateX(360deg) rotateY(180deg) rotateZ(90deg); }
            75%  { transform: translateZ(-40px) rotateX(540deg) rotateY(270deg) rotateZ(135deg); }
            100% { transform: translateZ(-40px) rotateX(720deg) rotateY(360deg) rotateZ(180deg); }
        }
        .anim-rolling { animation: rollFast 0.4s linear infinite; }
    </style>
</head>

    <!-- Celebration Particle Canvas -->
    <div id="particle-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <script>
        // ----------------------------------------------------
        // 1. AUDIO SYNTHESIZER
        // ----------------------------------------------------
        let audioCtx = null;
        let isAudioMuted = false;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(freq, type, duration, gainVal = 0.1) {
            if (isAudioMuted) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        
        function soundChip() { playTone(1200, 'sine', 0.05, 0.05); }
        function soundRollTick() { playTone(800, 'square', 0.03, 0.03); }
        function soundWin() { playTone(523.25, 'triangle', 0.15, 0.2); setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.2), 150); setTimeout(() => playTone(1046.50, 'triangle', 0.4, 0.2), 300); }
        function soundLose() { playTone(200, 'sawtooth', 0.3, 0.15); setTimeout(() => playTone(150, 'sawtooth', 0.5, 0.2), 250); }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = isAudioMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            document.getElementById('btn-audio').innerHTML = icon; document.getElementById('btn-audio-mobile').innerHTML = icon;
        }

        // ----------------------------------------------------
        // 2. BETTING CONTROLS
        // ----------------------------------------------------
        let isPlaying = false;
        let currentTotal = 7;

        function adjustStake(factor) {
            if (isPlaying) return;
            soundChip();
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 50;
            input.value = Math.max(10, Math.round(val * factor));
        }

        function setStake(amount) {
            if (isPlaying) return;
            soundChip();
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 0;
            input.value = val + amount;
        }

        // ----------------------------------------------------
        // 3. 3D DICE ENGINE
        // ----------------------------------------------------
        const Z_OFFSET = window.innerWidth >= 768 ? '50px' : '40px';
        
        // Maps a dice result (1-6) to the correct CSS 3D rotation
        const rotations = {
            1: `rotateY(0deg) translateZ(-${Z_OFFSET})`,
            2: `rotateY(-180deg) translateZ(-${Z_OFFSET})`,
            3: `rotateY(-90deg) translateZ(-${Z_OFFSET})`,
            4: `rotateY(90deg) translateZ(-${Z_OFFSET})`,
            5: `rotateX(-90deg) translateZ(-${Z_OFFSET})`,
            6: `rotateX(90deg) translateZ(-${Z_OFFSET})`
        };

        // Determine raw dice values based on total sum
        function splitTotalToDice(total) {
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = total - d1;
            // Adjust if logic breaks 1-6 bounds
            while (d2 < 1 || d2 > 6) {
                d1 = Math.floor(Math.random() * 6) + 1;
                d2 = total - d1;
            }
            // Add extra spins for visual effect (360 degrees = 1 full spin)
            const extraX = (Math.floor(Math.random() * 2) + 2) * 360; 
            const extraY = (Math.floor(Math.random() * 2) + 2) * 360;
            return { d1, d2, extraX, extraY };
        }

        let rollAudioInterval;

        async function playHilo(guess) {
            if (isPlaying) return;
            const stake = parseFloat(document.getElementById('stake').value);
            if (isNaN(stake) || stake < 10) { alert("Minimum bet is ₹10"); return; }

            isPlaying = true;
            
            // Highlight active weapon button
            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.add('opacity-50', 'pointer-events-none'));
            document.getElementById('btn-' + guess).classList.remove('opacity-50');

            document.getElementById('result-overlay').classList.add('hidden');
            const totEl = document.getElementById('current-tot');
            totEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-pink-500"></i>';

            // Start CSS Rolling Animation
            const cube1 = document.getElementById('dice-1');
            const cube2 = document.getElementById('dice-2');
            cube1.style.transition = 'none'; cube2.style.transition = 'none';
            cube1.classList.add('anim-rolling'); cube2.classList.add('anim-rolling');
            cube2.style.animationDelay = '0.1s'; // Offset second dice slightly

            // Start ticking audio
            if (!isAudioMuted) rollAudioInterval = setInterval(soundRollTick, 60);

            try {
                const res = await fetch('/hilo_dice/play', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({stake, guess, current: currentTotal}) 
                });
                const d = await res.json();
                
                if(d.success) {
                    currentTotal = d.next;
                    
                    // Allow rolling for 800ms to build suspense
                    setTimeout(() => {
                        clearInterval(rollAudioInterval);
                        
                        // Stop rolling animation and apply final calculated transform
                        cube1.classList.remove('anim-rolling');
                        cube2.classList.remove('anim-rolling');
                        cube1.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                        cube2.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

                        const diceVals = splitTotalToDice(currentTotal);
                        
                        // Apply final rotations WITH extra spins built into the CSS string
                        // Note: Because we removed anim-rolling, the CSS transition takes over
                        const r1Base = rotations[diceVals.d1].replace(`translateZ(-${Z_OFFSET})`, '').trim();
                        const r2Base = rotations[diceVals.d2].replace(`translateZ(-${Z_OFFSET})`, '').trim();
                        
                        cube1.style.transform = `translateZ(-${Z_OFFSET}) rotateX(${diceVals.extraX}deg) rotateY(${diceVals.extraY}deg) ${r1Base}`;
                        cube2.style.transform = `translateZ(-${Z_OFFSET}) rotateX(${diceVals.extraX}deg) rotateY(${diceVals.extraY}deg) ${r2Base}`;

                        // Wait for dice to physically snap into place (600ms)
                        setTimeout(() => {
                            totEl.innerText = currentTotal;
                            const msg = document.getElementById('result-msg');
                            const sub = document.getElementById('result-sub');
                            
                            document.getElementById('result-overlay').classList.remove('hidden');
                            document.getElementById('bal').innerText = d.new_total.toFixed(2);

                            if (d.win) {
                                soundWin();
                                spawnParticles();
                                msg.innerText = `WINNER!`;
                                msg.className = "text-5xl md:text-7xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-emerald-400 glow-win";
                                sub.innerText = `+₹${d.winnings.toFixed(2)}`;
                                sub.className = "text-2xl md:text-3xl font-bold mt-2 font-mono text-emerald-300 drop-shadow-md";
                            } else {
                                soundLose();
                                msg.innerText = "NO MATCH";
                                msg.className = "text-5xl md:text-7xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-red-500 glow-lose";
                                sub.innerText = "BET LOST";
                                sub.className = "text-xl md:text-2xl font-bold mt-2 font-mono text-red-400 drop-shadow-md";
                            }

                            // Reset UI for next roll
                            setTimeout(() => {
                                document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('opacity-50', 'pointer-events-none'));
                                isPlaying = false;
                            }, 1500);

                        }, 600); // Wait for dice snap
                    }, 800); // Initial roll duration

                } else { 
                    alert(d.error); resetError(); 
                }
            } catch(e) { 
                alert("Network Error"); resetError(); 
            }
        }

        function resetError() {
            clearInterval(rollAudioInterval);
            document.getElementById('dice-1').classList.remove('anim-rolling');
            document.getElementById('dice-2').classList.remove('anim-rolling');
            document.getElementById('current-tot').innerText = currentTotal;
            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('opacity-50', 'pointer-events-none'));
            isPlaying = false;
        }

        // ----------------------------------------------------
        // 4. CELEBRATION EFFECTS
        // ----------------------------------------------------
        function spawnParticles() {
            const container = document.getElementById('particle-container');
            const colors = ['#ec4899', '#a855f7', '#fbbf24', '#10b981'];
            
            for(let i=0; i<45; i++) {
                const p = document.createElement('div');
                p.innerHTML = '<i class="fa-solid fa-gem"></i>';
                p.className = "absolute text-2xl drop-shadow-lg";
                p.style.color = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '40%';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 15 + Math.random() * 25;
                const tx = Math.cos(angle) * velocity * 15;
                const ty = Math.sin(angle) * velocity * 15 - 150; // Bias upward
                
                container.appendChild(p);
                
                p.animate([
                    { transform: `translate(-50%, -50%) scale(0.5) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: 1000 + Math.random() * 1000, easing: 'cubic-bezier(0.25, 1, 0.5, 1)', fill: 'forwards' });
                
                setTimeout(() => p.remove(), 2000);
            }
        }

        // Initialize dice on load to show total 7 (3 and 4)
        document.addEventListener("DOMContentLoaded", () => {
            const cube1 = document.getElementById('dice-1');
            const cube2 = document.getElementById('dice-2');
            const r1Base = rotations[3].replace(`translateZ(-${Z_OFFSET})`, '').trim();
            const r2Base = rotations[4].replace(`translateZ(-${Z_OFFSET})`, '').trim();
            cube1.style.transform = `translateZ(-${Z_OFFSET}) ${r1Base}`;
            cube2.style.transform = `translateZ(-${Z_OFFSET}) ${r2Base}`;
        });
    </script>
</body>
