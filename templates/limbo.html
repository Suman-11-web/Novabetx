<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbo Rocket - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{bgDark:'#06090e'}}}}</script>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(6,182,212,0.1),transparent_50%)] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-cyan-900/20 to-transparent pointer-events-none"></div>

    <div class="w-full max-w-md bg-[#0a0d14]/90 backdrop-blur-xl border border-cyan-900/30 rounded-[2rem] p-8 text-center shadow-[0_20px_50px_rgba(0,0,0,0.8)] relative z-10">
        
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-800">
            <a href="/games" class="text-cyan-500 font-black text-sm uppercase tracking-widest hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Exit</a>
            <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700 shadow-inner text-white">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
        </div>

        <div class="relative py-10">
            <i class="fa-solid fa-rocket absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-9xl text-cyan-500/5 drop-shadow-[0_0_50px_rgba(6,182,212,0.2)]"></i>
            <div id="roll" class="text-7xl md:text-8xl font-black text-white font-mono tracking-tighter drop-shadow-lg relative z-10">1.00x</div>
            <div id="result-status" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mt-2 h-4">Set target & blast</div>
        </div>

        <div class="space-y-4 mb-8 bg-black/40 p-4 rounded-2xl border border-gray-800/50 shadow-inner">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Target Multiplier</label>
                    <span class="text-[9px] text-cyan-500 font-black bg-cyan-500/10 px-2 py-0.5 rounded">Max 1000x</span>
                </div>
                <div class="relative">
                    <input type="number" id="target" value="2.00" step="0.1" min="1.01" max="1000" class="w-full bg-[#1C232E] border border-gray-700 rounded-xl p-4 text-left pl-6 text-xl font-black text-cyan-400 outline-none focus:border-cyan-500 transition">
                    <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 font-black">X</div>
                </div>
            </div>
            
            <div>
                <label class="block text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1 text-left">Stake Amount</label>
                <div class="relative">
                    <input type="number" id="stake" value="50" min="10" class="w-full bg-[#1C232E] border border-gray-700 rounded-xl p-4 text-left pl-6 text-xl font-black text-white outline-none focus:border-cyan-500 transition">
                    <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 font-black">₹</div>
                </div>
            </div>
        </div>

        <button onclick="playLimbo()" id="play-btn" class="w-full py-5 bg-gradient-to-r from-cyan-600 to-cyan-400 text-black font-black text-xl rounded-xl uppercase tracking-wider transition-all shadow-[0_0_30px_rgba(6,182,212,0.4)] active:scale-[0.98] flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrow-trend-up"></i> BLAST OFF
        </button>
    </div>

    <script>
        async function playLimbo() {
            const btn = document.getElementById('play-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> CALCULATING';
            
            const stake = parseFloat(document.getElementById('stake').value);
            const target = parseFloat(document.getElementById('target').value);
            const rollEl = document.getElementById('roll');
            const statusEl = document.getElementById('result-status');
            
            try {
                const res = await fetch('/limbo/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake, target}) });
                const d = await res.json();
                
                if(d.success) {
                    rollEl.innerText = d.roll.toFixed(2) + "x";
                    if (d.win) {
                        rollEl.className = "text-7xl md:text-8xl font-black text-green-400 font-mono tracking-tighter drop-shadow-[0_0_20px_rgba(74,222,128,0.5)] relative z-10 animate-pulse";
                        statusEl.innerText = `YOU WON ₹${d.winnings.toFixed(2)}!`;
                        statusEl.className = "text-[10px] font-black uppercase tracking-widest text-green-400 mt-2 h-4";
                    } else {
                        rollEl.className = "text-7xl md:text-8xl font-black text-red-500 font-mono tracking-tighter drop-shadow-[0_0_20px_rgba(239,68,68,0.5)] relative z-10";
                        statusEl.innerText = "ROCKET CRASHED TOO EARLY";
                        statusEl.className = "text-[10px] font-black uppercase tracking-widest text-red-500 mt-2 h-4";
                    }
                    document.getElementById('bal').innerText = d.new_total.toFixed(2);
                } else { alert(d.error); }
            } catch(e) { alert("Network Error"); }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-arrow-trend-up"></i> BLAST OFF';
        }

        (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();
    </script>
</body>
</html>
