<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Up 7 Down - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-xl flex justify-between items-center py-4 border-b border-gray-800">
        <a href="/games" class="text-yellow-400 font-bold text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
        <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
    </header>

    <div class="w-full max-w-xl flex flex-col items-center justify-center my-auto">
        <div class="flex gap-8 mb-8 text-7xl text-yellow-400">
            <i id="d1" class="fa-solid fa-dice-one transition-transform"></i>
            <i id="d2" class="fa-solid fa-dice-one transition-transform"></i>
        </div>
        <div id="tot-label" class="text-3xl font-black mb-6 h-10 text-white">Total: 2</div>

        <div class="grid grid-cols-3 gap-3 w-full mb-6">
            <button onclick="setChoice('7Down')" id="btn-7Down" class="bet-opt py-4 rounded-xl border border-gray-700 bg-[#121721] font-black text-center hover:border-yellow-400">
                <span class="block text-xl text-blue-400">7 DOWN</span>
                <span class="text-[10px] text-gray-500">2x Payout</span>
            </button>
            <button onclick="setChoice('7')" id="btn-7" class="bet-opt py-4 rounded-xl border border-gray-700 bg-[#121721] font-black text-center hover:border-yellow-400">
                <span class="block text-xl text-yellow-400">LUCKY 7</span>
                <span class="text-[10px] text-gray-500">5x Payout</span>
            </button>
            <button onclick="setChoice('7Up')" id="btn-7Up" class="bet-opt py-4 rounded-xl border border-gray-700 bg-[#121721] font-black text-center hover:border-yellow-400">
                <span class="block text-xl text-red-400">7 UP</span>
                <span class="text-[10px] text-gray-500">2x Payout</span>
            </button>
        </div>
    </div>

    <div class="w-full max-w-xl bg-[#0a0d14] p-4 rounded-2xl border border-gray-800 flex gap-3">
        <input type="number" id="stake" value="50" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white outline-none">
        <button onclick="rollDice()" id="roll-btn" class="flex-1 py-4 bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xl rounded-xl uppercase tracking-wider">ROLL DICE</button>
    </div>

    <script>
        let chosen = '7Down';
        const diceClasses = ['fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];
        function setChoice(c) {
            chosen = c;
            document.querySelectorAll('.bet-opt').forEach(b => b.classList.remove('border-yellow-400', 'bg-yellow-400/10'));
            document.getElementById('btn-' + c).classList.add('border-yellow-400', 'bg-yellow-400/10');
        }
        setChoice('7Down');

        async function rollDice() {
            const btn = document.getElementById('roll-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            btn.disabled = true; btn.innerText = "ROLLING...";
            try {
                const res = await fetch('/seven_up_down/roll', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake, choice: chosen}) });
                const d = await res.json();
                if(d.success) {
                    document.getElementById('d1').className = `fa-solid ${diceClasses[d.d1 - 1]} animate-spin`;
                    document.getElementById('d2').className = `fa-solid ${diceClasses[d.d2 - 1]} animate-spin`;
                    setTimeout(() => {
                        document.getElementById('d1').className = `fa-solid ${diceClasses[d.d1 - 1]}`;
                        document.getElementById('d2').className = `fa-solid ${diceClasses[d.d2 - 1]}`;
                        document.getElementById('tot-label').innerText = `Total: ${d.total} (${d.result})`;
                        document.getElementById('tot-label').className = d.win ? "text-3xl font-black mb-6 h-10 text-green-400" : "text-3xl font-black mb-6 h-10 text-red-500";
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        btn.disabled = false; btn.innerText = "ROLL DICE";
                    }, 500);
                } else { alert(d.error); btn.disabled = false; btn.innerText = "ROLL DICE"; }
            } catch(e) { alert("Network Error"); btn.disabled = false; btn.innerText = "ROLL DICE"; }
        }
    </script>
</body>
</html>
