<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Admin Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-8 rounded-lg shadow-2xl w-96 border-t-4 border-red-600">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-black text-gray-800">SYSTEM ADMIN</h2>
            <p class="text-xs text-red-600 font-bold tracking-widest mt-1">RESTRICTED ACCESS</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded text-sm font-bold text-center {{ 'bg-red-100 text-red-700' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Admin ID</label>
                <input type="text" name="username" class="w-full border-2 border-gray-300 p-2 rounded focus:outline-none focus:border-red-600" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Passkey</label>
                <input type="password" name="password" class="w-full border-2 border-gray-300 p-2 rounded focus:outline-none focus:border-red-600" required>
            </div>
            <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded hover:bg-red-700 transition mt-4">
                AUTHENTICATE
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('login') }}" class="text-xs text-gray-400 hover:text-gray-600 underline">Return to Public Portal</a>
        </div>
    </div>
<script>
    (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();
</script>
</body>
</html>
