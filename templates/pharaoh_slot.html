<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharaoh's Tomb - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-2xl flex justify-between items-center py-4 border-b border-gray-800 mb-6">
        <a href="/games" class="text-amber-500 font-bold text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
        <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
    </header>

    <div class="w-full max-w-2xl flex flex-col items-center my-auto">
        <div class="w-full bg-[#121721] border-[6px] border-amber-500 rounded-3xl p-6 shadow-[0_0_50px_rgba(245,158,11,0.2)] text-center relative">
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-6 py-1 rounded-full font-black uppercase tracking-widest border-2 border-black">Pharaoh's Tomb</div>
            <div class="flex justify-between text-[10px] md:text-xs font-bold text-amber-300 mb-6 bg-black/40 p-2 rounded-lg border border-amber-900/50">
                <span>3 Match: 2x</span><span>4 Match: 10x</span><span>5 Match: 50x</span>
            </div>
            <div class="grid grid-cols-5 gap-2 bg-black p-4 rounded-xl border-y-4 border-amber-700 text-4xl md:text-6xl font-black shadow-inner">
                <div id="r1" class="py-6 bg-[#0a0d14] rounded border border-gray-800">🐪</div>
                <div id="r2" class="py-6 bg-[#0a0d14] rounded border border-gray-800">🦂</div>
                <div id="r3" class="py-6 bg-[#0a0d14] rounded border border-gray-800">🏺</div>
                <div id="r4" class="py-6 bg-[#0a0d14] rounded border border-gray-800">👁️</div>
                <div id="r5" class="py-6 bg-[#0a0d14] rounded border border-gray-800">𓋹</div>
            </div>
            <div id="win-txt" class="mt-6 text-2xl md:text-3xl font-black text-amber-400 h-10 uppercase tracking-widest drop-shadow-md">SPIN TO WIN</div>
        </div>
    </div>

    <div class="w-full max-w-2xl bg-[#0a0d14] p-4 rounded-2xl border border-gray-800 flex gap-3 mt-8">
        <input type="number" id="stake" value="50" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white outline-none focus:border-amber-500">
        <button onclick="spinSlots()" id="spin-btn" class="flex-1 py-4 bg-gradient-to-r from-amber-600 to-amber-400 text-black font-black text-xl rounded-xl uppercase shadow-[0_0_20px_rgba(245,158,11,0.4)]">SPIN REELS</button>
    </div>

    <script>
        async function spinSlots() {
            const btn = document.getElementById('spin-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            btn.disabled = true; btn.innerText = "SPINNING...";
            document.getElementById('win-txt').innerText = "......";
            const symbols = ['🏺', '🦂', '🐪', '👁️', '☥', '𓋹'];
            let spinInterval = setInterval(() => { [1,2,3,4,5].forEach(i => document.getElementById(`r${i}`).innerText = symbols[Math.floor(Math.random()*symbols.length)]); }, 50);
            try {
                const res = await fetch('/pharaoh_slot/spin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake}) });
                const d = await res.json();
                if(d.success) {
                    setTimeout(() => {
                        clearInterval(spinInterval);
                        [1,2,3,4,5].forEach(i => document.getElementById(`r${i}`).innerText = d.reels[i-1]);
                        document.getElementById('win-txt').innerText = d.winnings > 0 ? `BIG WIN! +₹${d.winnings} (${d.multiplier}x)` : "NO MATCH";
                        document.getElementById('win-txt').className = d.winnings > 0 ? "mt-6 text-2xl md:text-3xl font-black text-green-400 h-10 uppercase tracking-widest drop-shadow-[0_0_10px_rgba(74,222,128,0.8)]" : "mt-6 text-2xl md:text-3xl font-black text-gray-500 h-10 uppercase tracking-widest";
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        btn.disabled = false; btn.innerText = "SPIN REELS";
                    }, 1000);
                } else { alert(d.error); clearInterval(spinInterval); btn.disabled = false; btn.innerText = "SPIN REELS"; }
            } catch(e) { clearInterval(spinInterval); btn.disabled = false; btn.innerText = "SPIN REELS"; }
        }


        (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();
    </script>
</body>
</html>
