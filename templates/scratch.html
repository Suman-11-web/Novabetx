<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scratch & Win Pro - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#05070c',
                        surface: '#0d121c',
                        neonPurple: '#a855f7',
                        neonMagenta: '#d946ef',
                        neonGold: '#fbbf24'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 4px; }
        
        .arena-bg { background: radial-gradient(ellipse at center, #2e1065 0%, #05070c 100%); }

        /* 3D Scratch Card Base */
        .scratch-card-container {
            background: #111827;
            border: 4px solid #3b0764;
            box-shadow: 0 0 40px rgba(168,85,247,0.2), inset 0 0 20px rgba(0,0,0,0.8);
        }

        .scratch-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }
        
        /* Individual Symbol Slots */
        .scratch-slot { 
            aspect-ratio: 1; 
            background: radial-gradient(circle, #2e1065, #0f0626); 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3.5rem; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8); 
            border: 1px solid #581c87; 
            transition: all 0.3s; 
        }
        
        @media (min-width: 768px) {
            .scratch-slot { font-size: 5rem; }
        }

        /* Holographic Foil Cover */
        .scratch-cover { 
            position: absolute; 
            inset: -2px; 
            background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 25%, #e2e8f0 50%, #64748b 75%, #f1f5f9 100%);
            background-size: 200% 200%;
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2.5rem; 
            color: #334155; 
            border-radius: 14px;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8), inset 0 -5px 10px rgba(0,0,0,0.4);
            border: 2px solid #cbd5e1;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s;
            animation: foilShimmer 3s infinite linear;
        }

        @keyframes foilShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Scratched Animation Effect */
        .scratched .scratch-cover { 
            opacity: 0; 
            transform: scale(1.3) rotate(8deg); 
            filter: blur(8px);
            pointer-events: none; 
        }

        /* Winning Symbol Pulse */
        @keyframes winPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(251,191,36,0.8)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 30px rgba(251,191,36,1)); }
        }
        .sym-winner {
            animation: winPulse 1s infinite ease-in-out;
            z-index: 5;
            background: radial-gradient(circle, #7e22ce, #3b0764);
            border-color: #fbbf24;
        }

        .glow-win { filter: drop-shadow(0 0 30px rgba(16,185,129,0.8)); }
        .glow-lose { filter: drop-shadow(0 0 30px rgba(239,68,68,0.8)); }
    </style>
</head>

    <script>
        // ----------------------------------------------------
        // 1. WEB AUDIO API SYNTHESIZER
        // ----------------------------------------------------
        let audioCtx = null;
        let isAudioMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, gainVal = 0.1) {
            if (isAudioMuted) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // For white noise effect (scratching)
                if (type === 'noise') {
                    const bufferSize = audioCtx.sampleRate * duration;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    
                    // Bandpass filter to make it sound like scratching foil
                    const bandpass = audioCtx.createBiquadFilter();
                    bandpass.type = 'bandpass';
                    bandpass.frequency.value = 1000;
                    bandpass.Q.value = 1;
                    
                    noise.connect(bandpass);
                    bandpass.connect(gain);
                    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                    gain.connect(audioCtx.destination);
                    noise.start();
                    return;
                }
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundChip() { playTone(1200, 'sine', 0.05, 0.05); }
        function soundScratch() { playTone(0, 'noise', 0.15, 0.1); }
        function soundWin() {
            playTone(523.25, 'triangle', 0.15, 0.2); // C5
            setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.2), 150); // E5
            setTimeout(() => playTone(783.99, 'triangle', 0.15, 0.2), 300); // G5
            setTimeout(() => playTone(1046.50, 'triangle', 0.4, 0.25), 450); // C6
        }
        function soundLose() { 
            playTone(150, 'sawtooth', 0.4, 0.15); 
            setTimeout(() => playTone(100, 'sawtooth', 0.5, 0.2), 250); 
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = isAudioMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            document.getElementById('btn-audio').innerHTML = icon;
            document.getElementById('btn-audio-mobile').innerHTML = icon;
        }

        // ----------------------------------------------------
        // 2. BETTING STAKE CONTROLS
        // ----------------------------------------------------
        let isPlaying = false;

        function adjustStake(factor) {
            if (isPlaying) return;
            soundChip();
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 50;
            input.value = Math.max(10, Math.round(val * factor));
        }

        function setStake(amount) {
            if (isPlaying) return;
            soundChip();
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 0;
            input.value = val + amount;
        }

        // ----------------------------------------------------
        // 3. GAME ENGINE & ANIMATIONS
        // ----------------------------------------------------
        async function playScratch() {
            if (isPlaying) return;
            const btn = document.getElementById('play-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            if (isNaN(stake) || stake < 10) { alert('Minimum bet is ₹10'); return; }

            isPlaying = true;
            btn.classList.add('opacity-50', 'pointer-events-none', 'border-b-0', 'translate-y-1');
            btn.innerHTML = 'SCRATCHING... <span class="text-[10px] text-purple-200 font-bold tracking-widest uppercase mt-1"><i class="fa-solid fa-spinner fa-spin"></i> Revealing</span>';
            
            document.getElementById('result-overlay').classList.add('hidden');
            
            // Reset cards UI
            for(let i=0; i<9; i++) {
                const card = document.getElementById(`card-${i}`);
                card.classList.remove('scratched', 'sym-winner');
                document.getElementById(`sym-${i}`).innerText = '❓';
            }

            try {
                const res = await fetch('/scratch/play', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({stake}) 
                });
                const d = await res.json();
                
                if(d.success) {
                    // Staggered reveal for suspense
                    d.grid.forEach((sym, i) => {
                        setTimeout(() => {
                            soundScratch();
                            document.getElementById(`sym-${i}`).innerText = sym;
                            document.getElementById(`card-${i}`).classList.add('scratched');
                        }, i * 200); // Scratch one card every 200ms
                    });

                    // Determine the winning symbol if any
                    let winSym = null;
                    if (d.win) {
                        const counts = {};
                        d.grid.forEach(s => counts[s] = (counts[s] || 0) + 1);
                        for (const [sym, count] of Object.entries(counts)) {
                            if (count >= 3) winSym = sym;
                        }
                    }

                    // Resolution (Wait for all cards to be scratched)
                    setTimeout(() => {
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        const msg = document.getElementById('result-msg');
                        const sub = document.getElementById('result-sub');
                        
                        if (d.win) {
                            soundWin();
                            spawnParticles();
                            
                            // Highlight the specific winning symbols
                            for(let i=0; i<9; i++) {
                                if (d.grid[i] === winSym) {
                                    document.getElementById(`card-${i}`).classList.add('sym-winner');
                                }
                            }
                            
                            msg.innerText = `WINNER!`;
                            msg.className = "text-5xl md:text-7xl font-black italic drop-shadow-[0_0_30px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-emerald-400 glow-win";
                            sub.innerText = `+₹${d.winnings.toFixed(2)} (${d.multiplier}x)`;
                            sub.className = "text-2xl md:text-3xl font-bold mt-2 font-mono text-emerald-300 drop-shadow-md";
                        } else {
                            soundLose();
                            msg.innerText = "NO MATCH";
                            msg.className = "text-5xl md:text-7xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-gray-400 glow-lose";
                            sub.innerText = "BET LOST";
                            sub.className = "text-xl md:text-2xl font-bold mt-2 font-mono text-gray-500 drop-shadow-md";
                        }
                        
                        document.getElementById('result-overlay').classList.remove('hidden');
                        
                        // Reset button after delay
                        setTimeout(() => {
                            isPlaying = false;
                            btn.classList.remove('opacity-50', 'pointer-events-none', 'border-b-0', 'translate-y-1');
                            btn.innerHTML = 'BUY TICKET <span class="text-[10px] text-purple-200 font-bold tracking-widest uppercase mt-1 drop-shadow-none"><i class="fa-solid fa-coins"></i> Auto-Scratch</span>';
                        }, 1000);

                    }, (9 * 200) + 400); // Wait for all 9 cards + 400ms padding

                } else { 
                    alert(d.error); resetBtn(); 
                }
            } catch(e) { 
                alert("Network Error"); resetBtn(); 
            }
        }

        function resetBtn() {
            isPlaying = false;
            const btn = document.getElementById('play-btn');
            btn.classList.remove('opacity-50', 'pointer-events-none', 'border-b-0', 'translate-y-1');
            btn.innerHTML = 'BUY TICKET <span class="text-[10px] text-purple-200 font-bold tracking-widest uppercase mt-1 drop-shadow-none"><i class="fa-solid fa-coins"></i> Auto-Scratch</span>';
        }

        // ----------------------------------------------------
        // 4. CELEBRATION EFFECTS
        // ----------------------------------------------------
        function spawnParticles() {
            const container = document.getElementById('particle-container');
            const colors = ['#fbbf24', '#f59e0b', '#d946ef', '#10b981'];
            
            for(let i=0; i<50; i++) {
                const p = document.createElement('div');
                p.innerHTML = '<i class="fa-solid fa-star"></i>';
                p.className = "absolute text-3xl drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]";
                p.style.color = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                
                // Explosive radial trajectory
                const angle = Math.random() * Math.PI * 2;
                const velocity = 15 + Math.random() * 25;
                const tx = Math.cos(angle) * velocity * 20;
                const ty = Math.sin(angle) * velocity * 20 - 200; // Gravity bias upward
                
                container.appendChild(p);
                
                p.animate([
                    { transform: `translate(-50%, -50%) scale(0.5) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                });
                
                setTimeout(() => p.remove(), 2000);
            }
        }
    </script>
</body>
</html>
