<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon 777 Slots - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#05070c',
                        surface: '#0d121c',
                        neonPink: '#ec4899',
                        neonPurple: '#a855f7'
                    },
                    animation: {
                        'spin-fast': 'spin 0.15s linear infinite',
                        'bounce-slight': 'bounce-slight 0.3s ease-out'
                    },
                    keyframes: {
                        'bounce-slight': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
        
        .slot-machine-bg { background: linear-gradient(145deg, #180a1c 0%, #0d121c 100%); }
        .reel-container { box-shadow: inset 0 10px 20px rgba(0,0,0,0.8), inset 0 -10px 20px rgba(0,0,0,0.8); }
        
        .glow-pink { filter: drop-shadow(0 0 15px rgba(236,72,153,0.6)); }
        .glow-win { filter: drop-shadow(0 0 25px rgba(16,185,129,0.8)); }
        
        .blur-spin { filter: blur(3px); transform: scaleY(1.2); opacity: 0.8; }
        .reel-text { background: -webkit-linear-gradient(#fff, #cbd5e1); -webkit-background-clip: text; }
    </style>
</head>
<body class="bg-bgDark text-white min-h-screen flex flex-col md:flex-row pb-16 md:pb-0 select-none">

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 h-screen bg-[#090d15] border-r border-gray-800/80 shrink-0 sticky top-0 z-50">
        <div class="p-6 border-b border-gray-800/80 flex items-center justify-between">
            <div class="text-3xl font-black italic tracking-wider">Nova<span class="text-neonPink">betx</span></div>
            <span class="text-[10px] font-black uppercase tracking-widest bg-pink-500/10 text-pink-400 px-2 py-0.5 rounded border border-pink-500/20">PRO</span>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="{{ url_for('home') }}" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-bold transition"><i class="fa-solid fa-house w-5 text-center"></i> Home</a>
            <a href="{{ url_for('games') }}" class="flex items-center gap-3 p-3 bg-pink-500/10 text-pink-400 font-bold rounded-xl border border-pink-500/20"><i class="fa-solid fa-gamepad w-5 text-center"></i> Games Lobby</a>
            <a href="{{ url_for('profile') }}" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl font-bold transition"><i class="fa-solid fa-wallet w-5 text-center"></i> Deposit / Withdraw</a>
        </nav>
        <div class="p-4 border-t border-gray-800/80">
            <div class="flex items-center justify-between text-xs text-gray-400 font-bold px-2 py-1">
                <span>Audio FX</span>
                <button onclick="toggleAudio()" id="btn-audio" class="text-pink-400 text-sm hover:text-pink-300 transition"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </div>
    </aside>

    <!-- MAIN GAME STAGE -->
    <main class="flex-1 flex flex-col min-h-screen relative overflow-x-hidden">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center bg-[#090d15] px-4 py-3 border-b border-gray-800/80 sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <a href="{{ url_for('games') }}" class="md:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-left text-base"></i></a>
                <div class="flex items-center gap-2">
                    <span class="text-neonPink text-xl font-black italic tracking-wider flex items-center gap-2"><i class="fa-solid fa-gem"></i> NEON 777</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAudio()" class="md:hidden text-gray-400 hover:text-white text-base px-2" id="btn-audio-mobile"><i class="fa-solid fa-volume-high"></i></button>
                <div class="flex items-center bg-black/60 pl-3 pr-1 py-1 rounded-full border border-gray-800 shadow-inner">
                    <span class="text-xs font-bold text-gray-400 mr-1.5">₹</span>
                    <span id="bal" class="text-sm font-black text-pink-400 mr-2">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span>
                    <a href="{{ url_for('profile') }}?action=deposit" class="w-6 h-6 bg-pink-500 hover:bg-pink-400 text-black rounded-full flex items-center justify-center text-xs font-black transition shadow"><i class="fa-solid fa-plus"></i></a>
                </div>
            </div>
        </header>

        <!-- GAME AREA -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 md:p-8 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#1f0d1b] via-bgDark to-bgDark">
            
            <div class="w-full max-w-3xl flex flex-col lg:flex-row gap-6 items-center">
                
                <!-- SLOT MACHINE -->
                <div class="w-full lg:w-2/3 slot-machine-bg border-[6px] border-pink-500/80 rounded-[2.5rem] p-4 md:p-6 shadow-[0_0_50px_rgba(236,72,153,0.25)] relative">
                    
                    <!-- Top Payout Legend -->
                    <div class="flex justify-between items-center text-[9px] md:text-[11px] font-black uppercase tracking-widest text-pink-300 mb-6 bg-black/50 p-2 md:p-3 rounded-xl border border-pink-900/50 shadow-inner overflow-x-auto whitespace-nowrap gap-4">
                        <span class="flex items-center gap-1"><span class="text-yellow-400">777</span> 100x</span>
                        <span class="flex items-center gap-1"><span class="text-gray-300">BAR</span> 35x</span>
                        <span class="flex items-center gap-1"><span class="text-yellow-500">🔔</span> 20x</span>
                        <span class="flex items-center gap-1"><span class="text-purple-400">🍇</span> 12x</span>
                        <span class="flex items-center gap-1"><span class="text-yellow-300">🍋</span> 8x</span>
                        <span class="flex items-center gap-1"><span class="text-red-500">🍒</span> 5x</span>
                        <span class="flex items-center gap-1 border-l border-gray-700 pl-4 text-gray-400">Any 2: 1.5x</span>
                    </div>

                    <!-- The Reels -->
                    <div class="grid grid-cols-3 gap-2 md:gap-4 bg-black p-4 md:p-6 rounded-2xl border-y-4 border-gray-800 reel-container relative">
                        <!-- Horizontal win line -->
                        <div class="absolute top-1/2 left-0 w-full h-1 bg-pink-500/20 -translate-y-1/2 z-0 pointer-events-none"></div>

                        <div class="bg-[#0a0d15] border border-gray-800 rounded-xl py-8 md:py-12 flex items-center justify-center shadow-inner relative z-10 overflow-hidden h-32 md:h-48">
                            <span id="r1" class="text-6xl md:text-8xl font-black text-white glow-pink transition-all duration-75">777</span>
                        </div>
                        <div class="bg-[#0a0d15] border border-gray-800 rounded-xl py-8 md:py-12 flex items-center justify-center shadow-inner relative z-10 overflow-hidden h-32 md:h-48">
                            <span id="r2" class="text-6xl md:text-8xl font-black text-white glow-pink transition-all duration-75">777</span>
                        </div>
                        <div class="bg-[#0a0d15] border border-gray-800 rounded-xl py-8 md:py-12 flex items-center justify-center shadow-inner relative z-10 overflow-hidden h-32 md:h-48">
                            <span id="r3" class="text-6xl md:text-8xl font-black text-white glow-pink transition-all duration-75">777</span>
                        </div>
                    </div>

                    <!-- Status Display -->
                    <div class="mt-6 bg-black/60 rounded-xl border border-gray-800 h-16 flex items-center justify-center shadow-inner relative overflow-hidden">
                        <div id="win-txt" class="text-xl md:text-2xl font-black text-pink-500 uppercase tracking-[0.2em] relative z-10 transition-all duration-300">
                            INSERT COIN
                        </div>
                        <div id="win-bg-pulse" class="absolute inset-0 bg-green-500/20 opacity-0 transition-opacity duration-300"></div>
                    </div>
                </div>

                <!-- BETTING COCKPIT -->
                <div class="w-full lg:w-1/3 bg-surface border border-gray-800 rounded-[2rem] p-5 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Stake (₹)</label>
                        </div>

                        <!-- Main Input -->
                        <div class="relative flex mb-4">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-pink-500 font-bold text-lg">₹</span>
                            <input type="number" id="stake" value="50" min="10" step="10" class="w-full bg-black border border-gray-700 rounded-xl py-4 pl-10 pr-4 text-center text-3xl font-black text-white focus:border-pink-500 outline-none transition shadow-inner">
                        </div>

                        <!-- Quick Bets -->
                        <div class="grid grid-cols-4 gap-2 mb-6">
                            <button onclick="adjustStake(0.5)" class="bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold text-xs py-2 rounded-lg transition border border-gray-700">½</button>
                            <button onclick="adjustStake(2)" class="bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold text-xs py-2 rounded-lg transition border border-gray-700">2×</button>
                            <button onclick="setStake(10)" class="bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold text-xs py-2 rounded-lg transition border border-gray-700">+10</button>
                            <button onclick="setStake(50)" class="bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold text-xs py-2 rounded-lg transition border border-gray-700">+50</button>
                        </div>
                    </div>

                    <!-- Spin Button -->
                    <button onclick="spinSlots()" id="spin-btn" class="w-full h-24 bg-gradient-to-b from-pink-400 to-pink-600 hover:from-pink-300 hover:to-pink-500 text-black font-black text-4xl rounded-2xl uppercase tracking-widest transition-all shadow-[0_10px_30px_rgba(236,72,153,0.4)] border-b-4 border-pink-700 active:border-b-0 active:translate-y-1 flex flex-col items-center justify-center gap-1">
                        SPIN
                        <i class="fa-solid fa-arrows-rotate text-sm opacity-50"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Particles Container -->
    <div id="particle-container" class="fixed inset-0 pointer-events-none z-50"></div>

    <script>
        // ----------------------------------------------------
        // 1. WEB AUDIO API SYNTHESIZER
        // ----------------------------------------------------
        let audioCtx = null;
        let isAudioMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, gainVal = 0.1) {
            if (isAudioMuted) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundSpin() { playTone(150, 'sawtooth', 0.1, 0.05); }
        function soundLock() { playTone(300, 'square', 0.15, 0.15); }
        function soundWin() {
            playTone(523.25, 'sine', 0.15, 0.2); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.2), 150); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 300); // G5
            setTimeout(() => playTone(1046.50, 'sine', 0.5, 0.2), 450); // C6
        }
        function soundLose() { playTone(200, 'sawtooth', 0.4, 0.1); }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = isAudioMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            document.getElementById('btn-audio').innerHTML = icon;
            document.getElementById('btn-audio-mobile').innerHTML = icon;
        }

        // ----------------------------------------------------
        // 2. STAKE CONTROLS
        // ----------------------------------------------------
        function adjustStake(factor) {
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 50;
            input.value = Math.max(10, Math.round(val * factor));
        }
        function setStake(amount) {
            const input = document.getElementById('stake');
            let val = parseFloat(input.value) || 0;
            input.value = val + amount;
        }

        // ----------------------------------------------------
        // 3. GAME LOGIC & ANIMATION
        // ----------------------------------------------------
        const SYMBOLS = ['🍒', '🍋', '🍇', '🔔', 'BAR', '777'];
        let isSpinning = false;
        let spinIntervals = [];
        let audioInterval = null;

        async function spinSlots() {
            if (isSpinning) return;
            const btn = document.getElementById('spin-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            if (isNaN(stake) || stake < 10) { alert('Minimum bet is ₹10'); return; }

            isSpinning = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            const winTxt = document.getElementById('win-txt');
            const winBg = document.getElementById('win-bg-pulse');
            
            // Reset UI
            winTxt.innerText = "GOOD LUCK...";
            winTxt.classList.remove('glow-win', 'text-green-400');
            winTxt.classList.add('text-pink-500');
            winBg.classList.remove('opacity-100');
            reels.forEach(r => {
                r.classList.add('blur-spin');
                r.classList.remove('animate-bounce-slight');
            });

            // Start rapid visual spinning
            reels.forEach((r, i) => {
                spinIntervals[i] = setInterval(() => {
                    r.innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                }, 40 + (i * 10)); // Stagger visual speeds slightly
            });

            // Start mechanical ticking sound
            if(!isAudioMuted) audioInterval = setInterval(soundSpin, 80);

            try {
                // Fetch result from backend
                const res = await fetch('/slots/spin', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({stake}) 
                });
                const d = await res.json();
                
                if(d.success) {
                    // Pre-calculate balance to show immediately after animation
                    document.getElementById('bal').innerText = d.new_total.toFixed(2);

                    // Staggered Stopping Sequence
                    setTimeout(() => lockReel(0, d.reels[0], reels[0]), 500);
                    setTimeout(() => lockReel(1, d.reels[1], reels[1]), 1000);
                    setTimeout(() => {
                        lockReel(2, d.reels[2], reels[2]);
                        clearInterval(audioInterval);
                        
                        // Handle Win/Loss
                        setTimeout(() => {
                            if(d.winnings > 0) {
                                soundWin();
                                winTxt.innerText = `WIN: ₹${d.winnings.toFixed(2)} (${d.multiplier}x)`;
                                winTxt.classList.add('text-green-400', 'glow-win');
                                winTxt.classList.remove('text-pink-500');
                                winBg.classList.add('opacity-100');
                                spawnCoins();
                            } else {
                                soundLose();
                                winTxt.innerText = "NO WIN";
                            }
                            
                            isSpinning = false;
                            btn.classList.remove('opacity-50', 'cursor-not-allowed');
                        }, 400);

                    }, 1600);

                } else {
                    alert(d.error);
                    stopAllReels(reels);
                }
            } catch(e) {
                alert("Network Error");
                stopAllReels(reels);
            }
        }

        function lockReel(index, finalSymbol, el) {
            clearInterval(spinIntervals[index]);
            el.innerText = finalSymbol;
            el.classList.remove('blur-spin');
            
            // Add a mechanical "lock" bounce
            el.classList.add('animate-bounce-slight');
            setTimeout(() => el.classList.remove('animate-bounce-slight'), 300);
            
            soundLock();
        }

        function stopAllReels(reels) {
            reels.forEach((r, i) => clearInterval(spinIntervals[i]));
            clearInterval(audioInterval);
            isSpinning = false;
            document.getElementById('spin-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('win-txt').innerText = "ERROR";
        }

        // ----------------------------------------------------
        // 4. CELEBRATION EFFECTS
        // ----------------------------------------------------
        function spawnCoins() {
            const container = document.getElementById('particle-container');
            const colors = ['#f59e0b', '#fbbf24', '#10b981'];
            
            for(let i=0; i<30; i++) {
                const coin = document.createElement('div');
                coin.innerHTML = '<i class="fa-solid fa-circle-dollar-to-slot"></i>';
                coin.className = "absolute text-2xl drop-shadow-lg";
                coin.style.color = colors[Math.floor(Math.random() * colors.length)];
                coin.style.left = '50%';
                coin.style.top = '60%';
                
                // Random trajectory
                const angle = Math.random() * Math.PI * 2;
                const velocity = 10 + Math.random() * 20;
                const tx = Math.cos(angle) * velocity * 20;
                const ty = Math.sin(angle) * velocity * 20 - 200; // bias upward
                
                container.appendChild(coin);
                
                coin.animate([
                    { transform: `translate(-50%, -50%) scale(0.5) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                });
                
                setTimeout(() => coin.remove(), 2000);
            }
        }
    </script>
</body>
</html>
