<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thimbles - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .thimble-container { position: relative; width: 100%; height: 250px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; }
        .cup { position: absolute; width: 80px; height: 100px; background: linear-gradient(to bottom, #d97706, #78350f); border-radius: 10px 10px 5px 5px; cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); border: 2px solid #fbbf24; z-index: 20; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .cup:hover { filter: brightness(1.2); }
        .cup.lifted { transform: translateY(-80px); }
        .ball { position: absolute; bottom: 20px; width: 25px; height: 25px; background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309); border-radius: 50%; z-index: 10; display: none; box-shadow: 0 0 10px #f59e0b; }
        .pos-0 { left: calc(20% - 40px); } .pos-1 { left: calc(50% - 40px); } .pos-2 { left: calc(80% - 40px); }
    </style>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-lg flex justify-between items-center py-4 border-b border-gray-800 mb-6">
        <a href="/games" class="text-amber-500 font-bold text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
        <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
    </header>

    <div class="w-full max-w-lg bg-[#0a0d14] border border-amber-900/30 rounded-[2rem] p-6 text-center shadow-[0_0_30px_rgba(245,158,11,0.1)] relative">
        <h2 class="text-2xl font-black italic uppercase text-amber-500 mb-2">Thimbles</h2>
        <p id="status-text" class="text-xs text-gray-400 uppercase tracking-widest font-bold h-4">Set stake and shuffle</p>

        <div class="thimble-container mt-8 border-b-4 border-gray-800">
            <div id="ball" class="ball pos-1"></div>
            <div id="cup-0" onclick="pickCup(0)" class="cup pos-0"></div>
            <div id="cup-1" onclick="pickCup(1)" class="cup pos-1"></div>
            <div id="cup-2" onclick="pickCup(2)" class="cup pos-2"></div>
        </div>

        <div class="bg-black/50 p-4 rounded-xl border border-gray-800 mt-8 flex gap-3">
            <input type="number" id="stake" value="100" min="10" class="w-1/3 bg-transparent text-center text-xl font-black text-white focus:text-amber-400 outline-none border-r border-gray-700">
            <button id="play-btn" onclick="startShuffle()" class="flex-1 text-amber-500 hover:text-amber-400 font-black text-xl uppercase tracking-wider transition">SHUFFLE</button>
        </div>
    </div>

    <script>
        let isShuffling = false;
        let isPlaying = false;
        let currentStake = 0;

        async function startShuffle() {
            if (isShuffling || isPlaying) return;
            const stake = parseFloat(document.getElementById('stake').value);
            if (stake < 10) { alert("Min bet 10"); return; }
            
            document.getElementById('status-text').innerText = "SHUFFLING...";
            document.getElementById('ball').style.display = 'none';
            document.querySelectorAll('.cup').forEach(c => c.classList.remove('lifted'));
            
            isShuffling = true;
            currentStake = stake;

            // Simple visual shuffle loop
            let shuffles = 0;
            const interval = setInterval(() => {
                const cups = [0, 1, 2].sort(() => Math.random() - 0.5);
                document.getElementById('cup-0').className = `cup pos-${cups[0]}`;
                document.getElementById('cup-1').className = `cup pos-${cups[1]}`;
                document.getElementById('cup-2').className = `cup pos-${cups[2]}`;
                shuffles++;
                if (shuffles > 10) {
                    clearInterval(interval);
                    isShuffling = false;
                    isPlaying = true;
                    document.getElementById('status-text').innerText = "PICK A CUP! (Pays 2.85x)";
                    document.getElementById('status-text').classList.add('text-amber-400');
                }
            }, 150);
        }

        async function pickCup(pickedIdx) {
            if (!isPlaying || isShuffling) return;
            isPlaying = false;
            document.getElementById('status-text').innerText = "REVEALING...";
            
            try {
                const res = await fetch('/thimbles/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake: currentStake, cup: pickedIdx}) });
                const d = await res.json();
                
                if(d.success) {
                    const theBall = document.getElementById('ball');
                    // Find which cup element is currently at the ball's position
                    let winCupElId = "";
                    [0,1,2].forEach(id => {
                        if (document.getElementById(`cup-${id}`).classList.contains(`pos-${d.ball_cup}`)) {
                            winCupElId = `cup-${id}`;
                        }
                    });

                    theBall.className = `ball pos-${d.ball_cup}`;
                    theBall.style.display = 'block';
                    
                    document.getElementById(winCupElId).classList.add('lifted'); // Lift the winning cup
                    
                    // If user picked wrong cup, lift theirs too so they see it's empty
                    let userCupElId = "";
                    [0,1,2].forEach(id => {
                        if (document.getElementById(`cup-${id}`).classList.contains(`pos-${pickedIdx}`)) {
                            userCupElId = `cup-${id}`;
                        }
                    });
                    if (userCupElId !== winCupElId) document.getElementById(userCupElId).classList.add('lifted');

                    setTimeout(() => {
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        const status = document.getElementById('status-text');
                        status.innerText = d.win ? `WINNER! +₹${d.winnings.toFixed(2)}` : "WRONG CUP. YOU LOSE.";
                        status.className = `text-lg uppercase tracking-widest font-black h-6 ${d.win ? 'text-green-400' : 'text-red-500'}`;
                    }, 500);

                } else { alert(d.error); isPlaying = true; }
            } catch(e) { alert("Error"); isPlaying = true; }
        }


        (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();
    </script>
</body>
</html>
