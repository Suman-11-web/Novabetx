<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi-Lo - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .playing-card { width: 140px; height: 200px; background: white; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font-weight: 900; font-size: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 4px solid #0891b2; position: relative; transition: transform 0.4s; }
        .card-red { color: #ef4444; } .card-black { color: #111827; }
        .card-suit-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; opacity: 0.15; }
        .flip-card { animation: flip 0.5s ease-out; }
        @keyframes flip { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.1); } 100% { transform: rotateY(0deg) scale(1); } }
    </style>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#0a0d14]/90 border border-cyan-900/50 rounded-[2rem] p-8 text-center shadow-[0_0_40px_rgba(6,182,212,0.15)] relative overflow-hidden">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <a href="/games" class="text-cyan-500 font-bold text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
            <div class="text-sm font-bold bg-white/5 px-3 py-1 rounded-full">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
        </div>
        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-4">Current Card</div>
        <div class="flex justify-center mb-8 relative">
            <div id="card-display" class="playing-card card-black"><span id="card-rank-tl">7</span><div id="card-suit-mid" class="card-suit-large">♠</div><span id="card-suit-br" class="text-right">♠</span></div>
            <div id="result-msg" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 text-4xl font-black italic drop-shadow-[0_0_10px_rgba(0,0,0,1)] uppercase tracking-widest hidden w-full text-center"></div>
        </div>
        <div class="bg-black/40 p-4 rounded-xl border border-gray-800 mb-6">
            <input type="number" id="stake" value="100" min="10" class="w-full bg-transparent text-center text-2xl font-black text-white outline-none focus:text-cyan-400 mb-2">
            <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Base Stake (₹)</div>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <button onclick="playHilo('lower')" class="py-4 bg-red-900/60 hover:bg-red-800 border border-red-500/50 rounded-xl text-red-400 font-black uppercase text-sm transition shadow-lg flex flex-col items-center"><i class="fa-solid fa-arrow-down text-xl mb-1"></i> Lower</button>
            <button onclick="playHilo('same')" class="py-4 bg-gray-900/60 hover:bg-gray-800 border border-gray-500/50 rounded-xl text-gray-400 font-black uppercase text-sm transition shadow-lg flex flex-col items-center"><i class="fa-solid fa-equals text-xl mb-1"></i> Same</button>
            <button onclick="playHilo('higher')" class="py-4 bg-green-900/60 hover:bg-green-800 border border-green-500/50 rounded-xl text-green-400 font-black uppercase text-sm transition shadow-lg flex flex-col items-center"><i class="fa-solid fa-arrow-up text-xl mb-1"></i> Higher</button>
        </div>
    </div>

    <script>
        let currentVal = 7;
        const rankMap = {1:'A', 11:'J', 12:'Q', 13:'K'};
        async function playHilo(guess) {
            const stake = parseFloat(document.getElementById('stake').value);
            document.getElementById('result-msg').classList.add('hidden');
            const cardEl = document.getElementById('card-display');
            cardEl.classList.remove('flip-card');
            try {
                const res = await fetch('/hilo/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake, guess, current_card: currentVal}) });
                const d = await res.json();
                if(d.success) {
                    cardEl.classList.add('flip-card');
                    setTimeout(() => {
                        currentVal = d.next_card;
                        const rankStr = rankMap[currentVal] || currentVal.toString();
                        const suit = ['♠','♥','♦','♣'][Math.floor(Math.random()*4)];
                        cardEl.className = `playing-card ${suit==='♥'||suit==='♦' ? 'card-red':'card-black'}`;
                        document.getElementById('card-rank-tl').innerText = rankStr;
                        document.getElementById('card-suit-mid').innerText = suit;
                        document.getElementById('card-suit-br').innerText = suit;
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        const msg = document.getElementById('result-msg');
                        msg.innerText = d.win ? `+₹${d.winnings.toFixed(2)}` : "BUSTED";
                        msg.className = `absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 text-4xl font-black italic drop-shadow-[0_0_10px_rgba(0,0,0,1)] uppercase tracking-widest ${d.win ? 'text-green-400' : 'text-red-500'}`;
                        msg.classList.remove('hidden');
                    }, 250);
                } else { alert(d.error); }
            } catch(e) {}
        }
    </script>
</body>
</html>
