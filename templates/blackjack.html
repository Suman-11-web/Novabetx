<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack 21 - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{bgDark:'#06090e',brand:'#10b981'}}}}</script>
    <style>
        .felt-bg { background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%); }
        .playing-card { width: 60px; height: 85px; background: white; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 8px; font-weight: 900; font-size: 1.2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.5); border: 1px solid #e5e7eb; position: relative; animation: slideIn 0.4s ease-out forwards; opacity: 0; transform: translateY(-20px); }
        .card-red { color: #ef4444; } .card-black { color: #111827; }
        .card-suit-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; opacity: 0.2; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-bgDark text-white min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">

    <aside class="hidden md:flex flex-col w-64 h-screen bg-[#0a0d14] border-r border-gray-800 shrink-0 sticky top-0">
        <div class="p-6 border-b border-gray-800"><div class="text-3xl font-black italic tracking-wider">Nova<span class="text-emerald-500">betx</span></div></div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="/games" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white font-bold"><i class="fa-solid fa-arrow-left"></i> Back to Games</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-h-screen">
        <header class="flex justify-between items-center bg-[#0a0d14] p-4 border-b border-gray-800">
            <div class="text-xl font-black text-emerald-500 flex items-center gap-2"><i class="fa-solid fa-heart"></i> Blackjack 21</div>
            <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
        </header>

        <div class="flex-1 felt-bg flex flex-col justify-between p-4 md:p-8 relative overflow-hidden shadow-inner">
            
            <!-- Dealer Area -->
            <div class="flex flex-col items-center">
                <div class="text-emerald-300 font-bold tracking-widest text-xs mb-2 bg-black/40 px-3 py-1 rounded-full uppercase border border-emerald-900/50">Dealer <span id="dealer-score" class="ml-2 font-black text-white">?</span></div>
                <div id="dealer-cards" class="flex gap-2 min-h-[90px]"></div>
            </div>

            <!-- Result Overlay -->
            <div id="result-overlay" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 text-center w-full">
                <div id="result-msg" class="text-4xl md:text-6xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest"></div>
                <div id="result-win" class="text-xl font-bold text-emerald-400 mt-2"></div>
            </div>

            <!-- Player Area -->
            <div class="flex flex-col items-center mt-12">
                <div id="player-cards" class="flex gap-2 min-h-[90px]"></div>
                <div class="text-emerald-300 font-bold tracking-widest text-xs mt-4 bg-black/40 px-3 py-1 rounded-full uppercase border border-emerald-900/50">Player <span id="player-score" class="ml-2 font-black text-white">0</span></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-[#0a0d14] p-4 md:p-6 border-t border-gray-800">
            <div id="setup-controls" class="flex flex-col md:flex-row gap-3 max-w-2xl mx-auto">
                <input type="number" id="stake" value="50" min="10" class="w-full md:w-1/3 bg-black border border-gray-700 rounded-xl p-3 text-center text-xl font-black text-white focus:border-emerald-500 outline-none shadow-inner">
                <button onclick="deal()" class="w-full md:w-2/3 py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xl rounded-xl uppercase tracking-wider transition shadow-[0_0_20px_rgba(16,185,129,0.4)]">DEAL CARDS</button>
            </div>

            <div id="game-controls" class="hidden flex gap-3 max-w-2xl mx-auto">
                <button onclick="hit()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-500 text-white font-black text-lg rounded-xl uppercase tracking-wider transition shadow-lg">HIT <i class="fa-solid fa-plus ml-1"></i></button>
                <button onclick="stand()" class="flex-1 py-4 bg-red-600 hover:bg-red-500 text-white font-black text-lg rounded-xl uppercase tracking-wider transition shadow-lg">STAND <i class="fa-solid fa-hand ml-1"></i></button>
            </div>
        </div>
    </main>

    <script>
        function createCardHTML(card, hidden=false) {
            if (hidden) return `<div class="playing-card bg-gray-200" style="background: repeating-linear-gradient(45deg, #1f2937, #1f2937 10px, #111827 10px, #111827 20px);"></div>`;
            const isRed = card.suit === '♥' || card.suit === '♦';
            const colorClass = isRed ? 'card-red' : 'card-black';
            return `<div class="playing-card ${colorClass}">
                        <span>${card.rank}</span>
                        <div class="card-suit-large">${card.suit}</div>
                        <span class="text-right">${card.suit}</span>
                    </div>`;
        }

        async function deal() {
            const stake = parseFloat(document.getElementById('stake').value);
            const res = await fetch('/blackjack/deal', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake}) });
            const d = await res.json();
            if(d.success) {
                document.getElementById('bal').innerText = d.new_total.toFixed(2);
                document.getElementById('setup-controls').classList.add('hidden');
                document.getElementById('game-controls').classList.remove('hidden');
                document.getElementById('result-overlay').classList.add('hidden');
                
                document.getElementById('player-cards').innerHTML = d.player.map(c => createCardHTML(c)).join('');
                document.getElementById('dealer-cards').innerHTML = createCardHTML(d.dealer_up) + createCardHTML({}, true);
                
                document.getElementById('player-score').innerText = d.player_score;
                document.getElementById('dealer-score').innerText = "?";
            } else { alert(d.error); }
        }

        async function hit() {
            const res = await fetch('/blackjack/hit', { method: 'POST' });
            const d = await res.json();
            if(d.success) {
                document.getElementById('player-cards').innerHTML = d.player.map(c => createCardHTML(c)).join('');
                document.getElementById('player-score').innerText = d.score;
                if(d.bust) endGame("BUSTED!", "text-red-500", 0);
            }
        }

        async function stand() {
            document.getElementById('game-controls').classList.add('hidden');
            const res = await fetch('/blackjack/stand', { method: 'POST' });
            const d = await res.json();
            if(d.success) {
                document.getElementById('dealer-cards').innerHTML = d.dealer.map(c => createCardHTML(c)).join('');
                document.getElementById('dealer-score').innerText = d.dealer_score;
                let msg = d.win ? "YOU WIN!" : (d.push ? "PUSH" : "DEALER WINS");
                let color = d.win ? "text-emerald-400" : (d.push ? "text-gray-400" : "text-red-500");
                endGame(msg, color, d.winnings);
                document.getElementById('bal').innerText = d.new_total.toFixed(2);
            }
        }

        function endGame(msg, colorClass, winnings) {
            document.getElementById('game-controls').classList.add('hidden');
            document.getElementById('setup-controls').classList.remove('hidden');
            document.getElementById('result-overlay').classList.remove('hidden');
            document.getElementById('result-msg').className = `text-4xl md:text-6xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest ${colorClass}`;
            document.getElementById('result-msg').innerText = msg;
            document.getElementById('result-win').innerText = winnings > 0 ? `+ ₹${winnings.toFixed(2)}` : '';
        }
    </script>
</body>
</html>
