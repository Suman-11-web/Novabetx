<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Poker - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .playing-card { width: 100%; aspect-ratio: 2.5/3.5; background: white; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: 900; font-size: 1.5rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 2px solid #e5e7eb; position: relative; animation: popIn 0.3s ease-out; }
        .card-red { color: #ef4444; } .card-black { color: #111827; }
        .card-back { background: repeating-linear-gradient(45deg, #3730a3, #3730a3 10px, #312e81 10px, #312e81 20px); border: 2px solid #4f46e5; }
        .card-suit-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; opacity: 0.15; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-[#0a0d14] text-white min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">

    <aside class="hidden md:flex flex-col w-64 h-screen bg-[#0a0d14] border-r border-gray-800 shrink-0 sticky top-0">
        <div class="p-6 border-b border-gray-800"><div class="text-3xl font-black italic tracking-wider">Nova<span class="text-indigo-500">betx</span></div></div>
        <nav class="flex-1 p-4 space-y-2"><a href="/games" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white font-bold"><i class="fa-solid fa-arrow-left"></i> Back to Games</a></nav>
    </aside>

    <main class="flex-1 flex flex-col min-h-screen">
        <header class="flex justify-between items-center p-4 border-b border-gray-800">
            <div class="text-xl font-black text-indigo-500 flex items-center gap-2"><i class="fa-solid fa-crown"></i> Video Poker</div>
            <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
        </header>

        <div class="flex-1 flex flex-col justify-between p-4 md:p-8 bg-gradient-to-b from-[#1e1b4b] to-[#0a0d14] shadow-inner">
            
            <div class="w-full max-w-3xl mx-auto bg-black/40 border border-indigo-900/50 rounded-xl p-3 mb-6 flex justify-between text-[10px] md:text-xs font-mono text-indigo-300 overflow-x-auto whitespace-nowrap">
                <span class="px-2">Jacks+: 1.5x</span>
                <span class="px-2">2 Pair: 2x</span>
                <span class="px-2">3 Kind: 3x</span>
                <span class="px-2 text-indigo-100 font-bold bg-indigo-900/50 rounded">Full House: 9x</span>
                <span class="px-2 text-yellow-400 font-bold bg-yellow-900/30 rounded">4 Kind: 25x</span>
            </div>

            <!-- Cards Container -->
            <div id="cards-container" class="grid grid-cols-5 gap-2 md:gap-4 w-full max-w-3xl mx-auto mb-8">
                <div class="playing-card card-back"></div>
                <div class="playing-card card-back"></div>
                <div class="playing-card card-back"></div>
                <div class="playing-card card-back"></div>
                <div class="playing-card card-back"></div>
            </div>

            <!-- Result text -->
            <div class="text-center h-16 flex flex-col justify-center">
                <div id="result-hand" class="text-3xl font-black uppercase tracking-widest text-indigo-400 drop-shadow-md hidden"></div>
                <div id="result-win" class="text-lg font-bold text-white hidden"></div>
            </div>
        </div>

        <div class="bg-[#0a0d14] p-4 md:p-6 border-t border-gray-800 flex justify-center">
            <div class="w-full max-w-xl flex gap-3">
                <input type="number" id="stake" value="100" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white outline-none focus:border-indigo-500">
                <button id="deal-btn" onclick="playPoker()" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xl rounded-xl uppercase tracking-wider transition shadow-[0_0_20px_rgba(79,70,229,0.4)]">DRAW CARDS</button>
            </div>
        </div>
    </main>

    <script>
        function createCard(card) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const colorClass = isRed ? 'card-red' : 'card-black';
            return `<div class="playing-card ${colorClass}">
                        <span>${card.rank}</span>
                        <div class="card-suit-large">${card.suit}</div>
                        <span class="text-right">${card.suit}</span>
                    </div>`;
        }

        async function playPoker() {
            const btn = document.getElementById('deal-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            
            btn.disabled = true; btn.innerText = "DRAWING...";
            document.getElementById('result-hand').classList.add('hidden');
            document.getElementById('result-win').classList.add('hidden');
            
            try {
                const res = await fetch('/poker/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake}) });
                const d = await res.json();
                
                if(d.success) {
                    const container = document.getElementById('cards-container');
                    container.innerHTML = '';
                    
                    // Reveal cards one by one
                    d.cards.forEach((card, index) => {
                        setTimeout(() => {
                            container.innerHTML += createCard(card);
                        }, index * 150);
                    });

                    setTimeout(() => {
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        const handEl = document.getElementById('result-hand');
                        handEl.innerText = d.hand;
                        handEl.className = `text-3xl font-black uppercase tracking-widest drop-shadow-md ${d.winnings > 0 ? 'text-green-400' : 'text-gray-500'}`;
                        handEl.classList.remove('hidden');
                        
                        if(d.winnings > 0) {
                            const winEl = document.getElementById('result-win');
                            winEl.innerText = `+ ₹${d.winnings.toFixed(2)}`;
                            winEl.classList.remove('hidden');
                        }
                        
                        btn.disabled = false; btn.innerText = "DRAW NEW HAND";
                    }, 800);
                } else {
                    alert(d.error); btn.disabled = false; btn.innerText = "DRAW CARDS";
                }
            } catch(e) { alert("Network error"); btn.disabled = false; btn.innerText = "DRAW CARDS"; }
        }
    </script>
</body>
</html>
