<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .table-bg { background: linear-gradient(to right, #7c2d12, #9a3412); }
        .dice-icon { font-size: 6rem; color: #fff; text-shadow: 0 10px 15px rgba(0,0,0,0.5); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .rolling { animation: roll 0.4s infinite linear; }
        @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .bet-btn.active { border-color: #f97316; box-shadow: 0 0 15px rgba(249,115,22,0.5) inset; }
    </style>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">

    <aside class="hidden md:flex flex-col w-64 h-screen bg-[#0a0d14] border-r border-gray-800 shrink-0 sticky top-0">
        <div class="p-6 border-b border-gray-800"><div class="text-3xl font-black italic tracking-wider">Nova<span class="text-orange-500">betx</span></div></div>
        <nav class="flex-1 p-4 space-y-2"><a href="/games" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white font-bold"><i class="fa-solid fa-arrow-left"></i> Back to Games</a></nav>
    </aside>

    <main class="flex-1 flex flex-col min-h-screen">
        <header class="flex justify-between items-center bg-[#0a0d14] p-4 border-b border-gray-800">
            <div class="text-xl font-black text-orange-500 flex items-center gap-2"><i class="fa-solid fa-dice"></i> Craps Street</div>
            <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
        </header>

        <div class="flex-1 table-bg flex flex-col items-center justify-center p-4 shadow-inner relative">
            <div class="text-orange-200/50 font-black text-6xl md:text-9xl absolute pointer-events-none uppercase italic text-center leading-none">Vegas<br>Street</div>
            
            <div class="flex gap-8 md:gap-16 z-10 mb-8">
                <i id="dice1" class="fa-solid fa-dice-d6 dice-icon text-white"></i>
                <i id="dice2" class="fa-solid fa-dice-d6 dice-icon text-white"></i>
            </div>
            
            <div id="total-display" class="hidden z-10 text-4xl font-black bg-black/60 px-6 py-2 rounded-xl border border-orange-500/50 text-orange-400 shadow-xl"></div>
        </div>

        <div class="bg-[#0a0d14] p-4 md:p-6 border-t border-gray-800">
            <div class="max-w-xl mx-auto mb-4 grid grid-cols-2 gap-3">
                <button onclick="selectBet('Pass')" id="bet-Pass" class="bet-btn active bg-[#1C232E] border border-gray-700 py-4 rounded-xl flex flex-col items-center transition hover:bg-gray-800">
                    <span class="font-black text-lg text-white">PASS LINE</span>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Wins on 7 & 11</span>
                </button>
                <button onclick="selectBet('DontPass')" id="bet-DontPass" class="bet-btn bg-[#1C232E] border border-gray-700 py-4 rounded-xl flex flex-col items-center transition hover:bg-gray-800">
                    <span class="font-black text-lg text-white">DON'T PASS</span>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Wins on 2, 3, 12</span>
                </button>
            </div>

            <div class="w-full max-w-xl mx-auto flex gap-3">
                <input type="number" id="stake" value="100" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white outline-none focus:border-orange-500">
                <button id="roll-btn" onclick="rollDice()" class="flex-1 py-4 bg-orange-600 hover:bg-orange-500 text-white font-black text-xl rounded-xl uppercase tracking-wider transition shadow-[0_0_20px_rgba(249,115,22,0.4)]">ROLL DICE</button>
            </div>
        </div>
    </main>

    <script>
        let currentChoice = 'Pass';
        
        function selectBet(choice) {
            document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('bet-' + choice).classList.add('active');
            currentChoice = choice;
        }

        const diceClasses = ['fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];

        async function rollDice() {
            const btn = document.getElementById('roll-btn');
            const d1El = document.getElementById('dice1');
            const d2El = document.getElementById('dice2');
            const totEl = document.getElementById('total-display');
            const stake = parseFloat(document.getElementById('stake').value);
            
            btn.disabled = true; btn.innerText = "ROLLING...";
            totEl.classList.add('hidden');
            d1El.className = 'fa-solid fa-dice-d6 dice-icon text-white rolling';
            d2El.className = 'fa-solid fa-dice-d6 dice-icon text-white rolling';
            
            try {
                const res = await fetch('/craps/roll', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake: stake, choice: currentChoice}) });
                const d = await res.json();
                
                if(d.success) {
                    setTimeout(() => {
                        d1El.className = `fa-solid ${diceClasses[d.dice1 - 1]} dice-icon text-white`;
                        d2El.className = `fa-solid ${diceClasses[d.dice2 - 1]} dice-icon text-white text-red-500`; // Second die red for style
                        
                        totEl.innerText = `TOTAL: ${d.total}`;
                        totEl.classList.remove('hidden');
                        
                        if(d.win) { alert(`WINNER! + ₹${d.winnings.toFixed(2)}`); }
                        
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        btn.disabled = false; btn.innerText = "ROLL DICE";
                    }, 800);
                } else {
                    alert(d.error);
                    btn.disabled = false; btn.innerText = "ROLL DICE";
                }
            } catch(e) {
                alert("Network error.");
                btn.disabled = false; btn.innerText = "ROLL DICE";
            }
        }

        (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();
    </script>
</body>
</html>
