<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Streak - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .coin { width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #fde047, #b45309); border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5); border: 4px solid #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: transform 0.5s; }
        .flipping { animation: flip 0.6s infinite linear; }
        @keyframes flip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
    </style>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-gray-800 mb-6">
        <a href="/games" class="text-green-500 font-bold text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
        <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
    </header>

    <div class="w-full max-w-md flex flex-col items-center bg-[#0a0d14] p-8 rounded-3xl border border-gray-800 shadow-2xl relative my-auto">
        <div class="flex justify-between w-full mb-8">
            <div class="text-center"><span class="block text-[10px] text-gray-500 uppercase">Streak</span><span id="streak-counter" class="text-2xl font-black text-white">0</span></div>
            <div class="text-center"><span class="block text-[10px] text-gray-500 uppercase">Multiplier</span><span id="current-mult" class="text-2xl font-black text-green-500">1.00x</span></div>
            <div class="text-center"><span class="block text-[10px] text-gray-500 uppercase">Winnings</span><span id="current-win" class="text-2xl font-black text-green-400">₹0.00</span></div>
        </div>

        <div id="coin" class="coin mb-10"><i class="fa-solid fa-bolt"></i></div>
        <div id="result-msg" class="text-2xl font-black italic uppercase tracking-widest text-center h-8 mb-6 text-gray-400">Guess to start</div>

        <div class="flex gap-3 w-full mb-4">
            <input type="number" id="stake" value="50" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white focus:border-green-500 outline-none">
            <button id="cashout-btn" onclick="cashout()" class="flex-1 py-4 bg-gray-600 text-gray-400 font-black text-lg rounded-xl uppercase transition cursor-not-allowed" disabled>CASH OUT</button>
        </div>
        <button onclick="flipCoin()" id="flip-btn" class="w-full py-4 bg-gradient-to-r from-green-500 to-green-600 text-black font-black text-xl rounded-xl uppercase tracking-wider transition shadow-[0_0_20px_rgba(34,197,94,0.4)]">FLIP COIN</button>
    </div>

    <script>
        let currentStep = 0; let isPlaying = false; let currentWinnings = 0;
        async function flipCoin() {
            if(isPlaying && isNaN(parseFloat(document.getElementById('stake').value))) return;
            const stake = parseFloat(document.getElementById('stake').value);
            if(stake < 10) return alert("Min bet 10");
            isPlaying = true; currentStep++;
            const coin = document.getElementById('coin'); coin.classList.add('flipping');
            const btn = document.getElementById('flip-btn'); const cbtn = document.getElementById('cashout-btn');
            btn.disabled = true; btn.innerText = "FLIPPING..."; cbtn.disabled = true;
            try {
                const res = await fetch('/coin_streak/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake, step: currentStep}) });
                const d = await res.json();
                if(d.success) {
                    if (currentStep === 1) document.getElementById('bal').innerText = d.new_total.toFixed(2);
                    setTimeout(() => {
                        coin.classList.remove('flipping');
                        if(d.win) {
                            coin.innerHTML = '<i class="fa-solid fa-check text-green-500 bg-white/20 rounded-full p-2"></i>';
                            currentWinnings = d.winnings; document.getElementById('streak-counter').innerText = currentStep;
                            document.getElementById('current-mult').innerText = d.multiplier + 'x'; document.getElementById('current-win').innerText = '₹' + d.winnings.toFixed(2);
                            document.getElementById('result-msg').innerText = "SUCCESS! FLIP AGAIN?"; document.getElementById('result-msg').className = "text-xl font-black italic uppercase tracking-widest text-center h-8 mb-6 text-green-400";
                            btn.disabled = false; btn.innerText = "FLIP AGAIN";
                            cbtn.disabled = false; cbtn.className = "flex-1 py-4 bg-gray-200 hover:bg-white text-black font-black text-lg rounded-xl uppercase transition shadow-lg";
                        } else {
                            coin.innerHTML = '<i class="fa-solid fa-xmark text-red-500 bg-white/20 rounded-full p-2"></i>';
                            document.getElementById('result-msg').innerText = "STREAK BROKEN!"; document.getElementById('result-msg').className = "text-2xl font-black italic uppercase tracking-widest text-center h-8 mb-6 text-red-500";
                            setTimeout(resetToStart, 2000);
                        }
                    }, 600);
                } else { alert(d.error); resetToStart(); }
            } catch(e) { resetToStart(); }
        }
        async function cashout() {
            if(!isPlaying || currentWinnings === 0) return;
            try {
                const res = await fetch('/coin_streak/cashout', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({winnings: currentWinnings}) });
                const d = await res.json();
                if(d.success) {
                    document.getElementById('bal').innerText = d.new_total.toFixed(2); alert(`Cashed out: ₹${currentWinnings.toFixed(2)}`); resetToStart();
                }
            } catch(e) {}
        }
        function resetToStart() {
            isPlaying = false; currentStep = 0; currentWinnings = 0;
            document.getElementById('coin').innerHTML = '<i class="fa-solid fa-bolt"></i>';
            document.getElementById('streak-counter').innerText = '0'; document.getElementById('current-mult').innerText = '1.00x';
            document.getElementById('current-win').innerText = '₹0.00'; document.getElementById('result-msg').innerText = "Guess to start";
            document.getElementById('result-msg').className = "text-xl font-black italic uppercase tracking-widest text-center h-8 mb-6 text-gray-400";
            const btn = document.getElementById('flip-btn'); btn.innerText = "FLIP COIN"; btn.disabled = false;
            const cbtn = document.getElementById('cashout-btn'); cbtn.disabled = true; cbtn.className = "flex-1 py-4 bg-gray-600 text-gray-400 font-black text-lg rounded-xl uppercase cursor-not-allowed";
        }
        (function() {
    // 1. Block Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    }, false);

    // 2. Block All DevTools & View-Source Keyboard Shortcuts (Windows + Mac)
    document.addEventListener('keydown', function(e) {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;

        // F12 (Windows / Laptop Fn+F12)
        if (code === 123 || key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // Windows / Linux: Ctrl + Shift + (I, J, C, K)
        if (e.ctrlKey && e.shiftKey && (['i', 'j', 'c', 'k'].includes(key) || [73, 74, 67, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // macOS: Cmd (metaKey) + Option (altKey) + (I, J, C, U, K)
        if (e.metaKey && e.altKey && (['i', 'j', 'c', 'u', 'k'].includes(key) || [73, 74, 67, 85, 75].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        // View Source & Save Page: Ctrl+U / Cmd+U / Ctrl+S / Cmd+S
        if ((e.ctrlKey || e.metaKey) && (['u', 's'].includes(key) || [85, 83].includes(code))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // 3. Disable Dragging Images/Elements
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });

    // 4. Anti-Debugger Trap (Triggers if DevTools is opened via Browser Menu)
    setInterval(function() {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
            document.body.innerHTML = '<div style="background:#05070c;color:#ef4444;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:0.1em;text-align:center;padding:20px;">SECURITY ALERT: DEVELOPER TOOLS ARE RESTRICTED ON NOVABETX.</div>';
        }
    }, 1500);
})();




    </script>
</body>
</html>
