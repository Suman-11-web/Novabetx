<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Racing - Novabetx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .track-bg { background: repeating-linear-gradient(90deg, #166534, #166534 50px, #14532d 50px, #14532d 100px); }
        .horse-track { border-bottom: 2px dashed rgba(255,255,255,0.2); position: relative; height: 60px; display: flex; align-items: center; }
        .horse { font-size: 2.5rem; position: absolute; left: 0; transition: left 3s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .finish-line { position: absolute; right: 10%; top: 0; bottom: 0; width: 4px; background: repeating-linear-gradient(to bottom, #fff 0, #fff 10px, #000 10px, #000 20px); z-index: 10; }
        .horse-btn { transition: all 0.2s; border: 2px solid transparent; }
        .horse-btn.active { border-color: #f59e0b; background: rgba(245, 158, 11, 0.2); transform: scale(1.05); box-shadow: 0 0 15px rgba(245,158,11,0.5); }
    </style>
</head>
<body class="bg-[#06090e] text-white min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-3xl flex justify-between items-center py-4 border-b border-gray-800 mb-6">
        <a href="/games" class="text-amber-500 font-bold text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-1"></i> Games</a>
        <div class="text-sm font-bold bg-white/5 px-4 py-1.5 rounded-full border border-gray-700">₹<span id="bal">{{ "%.2f"|format(user.balance + user.bonus_balance) }}</span></div>
    </header>

    <div class="w-full max-w-3xl my-auto">
        <div class="track-bg border-4 border-gray-800 rounded-2xl overflow-hidden relative mb-8 shadow-2xl p-4">
            <div class="finish-line"></div>
            <div id="result-overlay" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-30 flex flex-col items-center justify-center">
                <div id="result-msg" class="text-5xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-amber-400"></div>
            </div>

            <div class="horse-track"><span class="w-8 font-black text-gray-400">1</span><i id="h-1" class="fa-solid fa-horse-head horse text-red-500"></i></div>
            <div class="horse-track"><span class="w-8 font-black text-gray-400">2</span><i id="h-2" class="fa-solid fa-horse-head horse text-blue-500"></i></div>
            <div class="horse-track"><span class="w-8 font-black text-gray-400">3</span><i id="h-3" class="fa-solid fa-horse-head horse text-green-500"></i></div>
            <div class="horse-track border-none"><span class="w-8 font-black text-gray-400">4</span><i id="h-4" class="fa-solid fa-horse-head horse text-yellow-500"></i></div>
        </div>

        <div class="bg-[#121721] p-4 rounded-2xl border border-gray-800 mb-6">
            <div class="text-[10px] text-amber-500 font-bold uppercase tracking-widest mb-3 text-center">Pick Your Horse (Pays 3.8x)</div>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="pickHorse(1)" id="btn-1" class="horse-btn active bg-black py-4 rounded-xl text-3xl text-red-500"><i class="fa-solid fa-horse-head"></i></button>
                <button onclick="pickHorse(2)" id="btn-2" class="horse-btn bg-black py-4 rounded-xl text-3xl text-blue-500"><i class="fa-solid fa-horse-head"></i></button>
                <button onclick="pickHorse(3)" id="btn-3" class="horse-btn bg-black py-4 rounded-xl text-3xl text-green-500"><i class="fa-solid fa-horse-head"></i></button>
                <button onclick="pickHorse(4)" id="btn-4" class="horse-btn bg-black py-4 rounded-xl text-3xl text-yellow-500"><i class="fa-solid fa-horse-head"></i></button>
            </div>
        </div>

        <div class="bg-[#0a0d14] p-4 rounded-2xl border border-gray-800 flex gap-3">
            <input type="number" id="stake" value="100" min="10" class="w-1/3 bg-black border border-gray-700 rounded-xl text-center text-xl font-black text-white focus:border-amber-500 outline-none">
            <button id="race-btn" onclick="startRace()" class="flex-1 py-4 bg-amber-600 hover:bg-amber-500 text-white font-black text-xl rounded-xl uppercase tracking-wider transition shadow-[0_0_20px_rgba(217,119,6,0.4)]">START RACE</button>
        </div>
    </div>

    <script>
        let chosenHorse = 1;
        let isRacing = false;

        function pickHorse(h) {
            if(isRacing) return;
            document.querySelectorAll('.horse-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + h).classList.add('active');
            chosenHorse = h;
        }

        async function startRace() {
            if(isRacing) return;
            const btn = document.getElementById('race-btn');
            const stake = parseFloat(document.getElementById('stake').value);
            
            btn.disabled = true; btn.innerText = "RACING...";
            isRacing = true;
            document.getElementById('result-overlay').classList.add('hidden');
            
            // Reset horses
            [1,2,3,4].forEach(i => document.getElementById(`h-${i}`).style.left = '0');

            try {
                const res = await fetch('/horse_racing/race', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({stake, horse: chosenHorse}) });
                const d = await res.json();
                
                if(d.success) {
                    // Animate horses
                    [1,2,3,4].forEach(i => {
                        const hEl = document.getElementById(`h-${i}`);
                        // The winner goes to 90% (finish line), others randomize between 50% and 85%
                        const distance = (i === d.winner) ? '90%' : `${50 + Math.random() * 35}%`;
                        hEl.style.left = distance;
                    });

                    setTimeout(() => {
                        document.getElementById('bal').innerText = d.new_total.toFixed(2);
                        const msg = document.getElementById('result-msg');
                        if (d.win) {
                            msg.innerText = `HORSE ${d.winner} WINS!\n+₹${d.winnings.toFixed(2)}`;
                            msg.className = "text-5xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-green-400";
                        } else {
                            msg.innerText = `HORSE ${d.winner} WINS`;
                            msg.className = "text-5xl font-black italic drop-shadow-[0_0_20px_rgba(0,0,0,1)] uppercase tracking-widest text-center text-red-500";
                        }
                        document.getElementById('result-overlay').classList.remove('hidden');
                        btn.disabled = false; btn.innerText = "START RACE";
                        isRacing = false;
                    }, 3200);

                } else { alert(d.error); btn.disabled = false; btn.innerText = "START RACE"; isRacing = false; }
            } catch(e) { alert("Error"); btn.disabled = false; btn.innerText = "START RACE"; isRacing = false; }
        }
    </script>
</body>
</html>
